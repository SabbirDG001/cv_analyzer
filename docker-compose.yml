services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillbridge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillbridge"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    # DATABASE_URL comes from backend/.env: local Postgres by default, Supabase when you switch.
    env_file: [./backend/.env]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [./backend:/srv]

  frontend:
    build: ./frontend
    env_file: [./frontend/.env]
    environment:
      # Server-side calls use the compose network; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
